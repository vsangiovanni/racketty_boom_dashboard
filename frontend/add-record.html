<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Add Record - Racketty Boom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-slate-800 pb-20">

  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="window.history.back()" class="p-2 -ml-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
          <span class="material-icons-round">arrow_back</span>
        </button>
        <h1 id="page-title" class="text-xl font-bold tracking-tight">Manual Entry</h1>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 mt-4">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <form id="record-form" class="space-y-6">
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Record Type</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative flex cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm focus-within:ring-2 focus-within:ring-blue-600 hover:bg-slate-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
              <input type="radio" name="type" value="Expense" class="sr-only" checked onchange="toggleTaxes()">
              <div class="flex items-center gap-2 text-slate-800 font-medium"><span class="material-icons-round text-rose-500">remove_circle</span> Expense</div>
            </label>
            <label class="relative flex cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm focus-within:ring-2 focus-within:ring-blue-600 hover:bg-slate-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
              <input type="radio" name="type" value="Income" class="sr-only" onchange="toggleTaxes()">
              <div class="flex items-center gap-2 text-slate-800 font-medium"><span class="material-icons-round text-green-500">add_circle</span> Income</div>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Vendor / Date -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Vendor / Customer *</label>
            <input type="text" id="vendor" required class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600" placeholder="e.g. Home Depot, Shell">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Date *</label>
            <input type="date" id="date" required class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600">
          </div>
          
          <!-- Category / Invoice -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
            <div class="flex gap-2">
              <select id="category_id" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none bg-white">
                <option value="">Loading...</option>
              </select>
              <button type="button" onclick="document.getElementById('category-modal').classList.remove('hidden')" class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium border border-slate-200">Manage</button>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Invoice Number</label>
            <input type="text" id="invoice_number" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600" placeholder="e.g. INV-1045">
          </div>

          <!-- Items -->
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Items / Details</label>
            <input type="text" id="items" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600" placeholder="e.g. 2x Hammers, 1x Nails">
          </div>

          <!-- Amounts -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Subtotal</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">$</span>
              <input type="number" step="0.01" id="subtotal" class="w-full rounded-xl border border-slate-300 pl-8 pr-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600" placeholder="0.00">
            </div>
          </div>
          
          <div id="tax-paid-group">
            <label class="block text-sm font-medium text-slate-700 mb-1">Sales Tax Paid</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">$</span>
              <input type="number" step="0.01" id="sales_tax_paid" class="w-full rounded-xl border border-slate-300 pl-8 pr-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600" placeholder="0.00">
            </div>
          </div>
          <div id="tax-owed-group" class="hidden">
            <label class="block text-sm font-medium text-slate-700 mb-1">Sales Tax Owed</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">$</span>
              <input type="number" step="0.01" id="sales_tax_owed" class="w-full rounded-xl border border-slate-300 pl-8 pr-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600" placeholder="0.00">
            </div>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-bold text-slate-800 mb-1">Total Amount *</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-800 font-bold text-lg">$</span>
              <input type="number" step="0.01" id="total" required class="w-full rounded-xl border-2 border-slate-300 bg-slate-50 font-bold text-lg pl-9 pr-4 py-3 focus:border-blue-600 focus:bg-white focus:outline-none focus:ring-0" placeholder="0.00">
            </div>
          </div>

          <!-- Metadata -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Payment Method</label>
            <select id="payment_method" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none bg-white">
              <option value="">Select...</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="Cash">Cash</option>
              <option value="Check">Check</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Location</label>
            <input type="text" id="location" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600" placeholder="e.g. Miami Branch">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Notes / Description</label>
          <textarea id="notes" rows="2" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:border-blue-600 focus:outline-none focus:ring-1 focus:ring-blue-600"></textarea>
        </div>

        <button type="submit" id="btn-save" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 px-4 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
          <span class="material-icons-round">save</span>
          <span id="btn-save-text">Save Record</span>
        </button>

      </form>
    </div>
  </main>

  <!-- Category Management Modal -->
  <div id="category-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center">
        <h3 class="font-bold text-lg">Manage Categories</h3>
        <button type="button" onclick="document.getElementById('category-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><span class="material-icons-round">close</span></button>
      </div>
      <div class="p-4">
        <div class="flex gap-2 mb-4">
          <input type="text" id="new-category-name" class="flex-1 rounded-lg border border-slate-300 px-3 py-2" placeholder="New category...">
          <button type="button" onclick="addCategory()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm">Add</button>
        </div>
      </div>
      <div class="overflow-y-auto flex-1 p-4 pt-0">
        <ul id="category-list" class="divide-y divide-slate-100 border border-slate-100 rounded-lg">
          <!-- List injected here -->
        </ul>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();

    const subtotalEl = document.getElementById('subtotal');
    const taxPaidEl = document.getElementById('sales_tax_paid');
    const taxOwedEl = document.getElementById('sales_tax_owed');
    const totalEl = document.getElementById('total');

    function toggleTaxes() {
      const isIncome = document.querySelector('input[name="type"]:checked').value === 'Income';
      document.getElementById('tax-paid-group').style.display = isIncome ? 'none' : 'block';
      document.getElementById('tax-owed-group').style.display = isIncome ? 'block' : 'none';
      if (isIncome) taxPaidEl.value = ''; else taxOwedEl.value = '';
      calcTotal();
    }

    function calcTotal() {
      const s = parseFloat(subtotalEl.value) || 0;
      const tP = parseFloat(taxPaidEl.value) || 0;
      const tO = parseFloat(taxOwedEl.value) || 0;
      if (s > 0) {
        totalEl.value = (s + tP + tO).toFixed(2);
      }
    }

    subtotalEl.addEventListener('input', calcTotal);
    taxPaidEl.addEventListener('input', calcTotal);
    taxOwedEl.addEventListener('input', calcTotal);

    let editRecordId = new URLSearchParams(window.location.search).get('id');

    async function loadRecordData() {
      if (!editRecordId) return;
      try {
        document.getElementById('page-title').textContent = 'Edit Record';
        document.getElementById('btn-save-text').textContent = 'Update Record';
        
        const res = await fetch(`/api/transactions/${editRecordId}`);
        if (!res.ok) throw new Error('Record not found');
        const tx = await res.json();
        
        document.querySelector(`input[name="type"][value="${tx.type}"]`).checked = true;
        toggleTaxes();
        
        document.getElementById('vendor').value = tx.vendor || '';
        document.getElementById('date').value = tx.transaction_date ? tx.transaction_date.slice(0, 10) : '';
        document.getElementById('category_id').value = tx.category_id || '';
        document.getElementById('invoice_number').value = tx.invoice_number || '';
        document.getElementById('items').value = tx.items || '';
        document.getElementById('subtotal').value = tx.subtotal || '';
        
        if (tx.type === 'Income') {
          document.getElementById('sales_tax_owed').value = tx.sales_tax_owed || '';
        } else {
          document.getElementById('sales_tax_paid').value = tx.sales_tax_paid || '';
        }
        
        document.getElementById('total').value = tx.amount || '';
        document.getElementById('payment_method').value = tx.payment_method || '';
        document.getElementById('location').value = tx.location || '';
        document.getElementById('notes').value = tx.notes || '';
      } catch (err) {
        alert('Could not load record: ' + err.message);
      }
    }

    // Categories Logic
    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        const cats = await res.json();
        
        const sel = document.getElementById('category_id');
        const currentVal = sel.value; // preserve value if already set by loadRecordData
        sel.innerHTML = '<option value="">Select Category...</option>';
        
        const list = document.getElementById('category-list');
        list.innerHTML = '';
        
        cats.forEach(c => {
          sel.add(new Option(c.name, c.id));
          list.innerHTML += `<li class="p-3 flex justify-between items-center hover:bg-slate-50">
            <span class="text-sm font-medium text-slate-700">${c.name}</span>
            <button type="button" onclick="deleteCategory(${c.id})" class="text-rose-500 hover:text-rose-700 p-1"><span class="material-icons-round text-[18px]">delete</span></button>
          </li>`;
        });
        
        if (currentVal) sel.value = currentVal;
      } catch(e) { console.error('Error loading categories'); }
    }

    async function initializePage() {
      document.getElementById('date').valueAsDate = new Date();
      await loadCategories();
      await loadRecordData();
    }
    initializePage();

    async function addCategory() {
      const input = document.getElementById('new-category-name');
      const name = input.value.trim();
      if(!name) return;
      try {
        await fetch('/api/categories', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name })
        });
        input.value = '';
        loadCategories();
      } catch(e) { alert('Failed to add category'); }
    }

    async function deleteCategory(id) {
      if(!confirm('Delete this category?')) return;
      try {
        await fetch(`/api/categories/${id}`, { method: 'DELETE' });
        loadCategories();
      } catch(e) { alert('Failed to delete'); }
    }

    loadCategories();

    // Form Submit
    document.getElementById('record-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-icons-round animate-spin">autorenew</span><span>Saving...</span>';

      const type = document.querySelector('input[name="type"]:checked').value;
      const payload = {
        type,
        vendor: document.getElementById('vendor').value,
        date: document.getElementById('date').value,
        invoice_number: document.getElementById('invoice_number').value,
        items: document.getElementById('items').value,
        subtotal: parseFloat(subtotalEl.value) || 0,
        sales_tax_paid: parseFloat(taxPaidEl.value) || 0,
        sales_tax_owed: parseFloat(taxOwedEl.value) || 0,
        total: parseFloat(totalEl.value) || 0,
        category_id: document.getElementById('category_id').value,
        payment_method: document.getElementById('payment_method').value,
        location: document.getElementById('location').value,
        notes: document.getElementById('notes').value
      };

      try {
        const method = editRecordId ? 'PUT' : 'POST';
        const url = editRecordId ? `/api/transactions/${editRecordId}` : '/api/transactions';
        
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error((await response.json()).error);
        window.location.href = '/';
      } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-round">save</span><span id="btn-save-text">' + (editRecordId ? 'Update Record' : 'Save Record') + '</span>';
      }
    });
  </script>
</body>
</html>
