<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/brand-defaults.js"></script>
  <title>Secure Access - Racketty Boom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(248,250,252,1) 100%); }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col relative overflow-x-hidden">
  
  <header class="relative z-20 border-b border-slate-800/80 bg-slate-900/95 backdrop-blur-sm shrink-0">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
      <div class="min-w-0 flex-1 text-center">
        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide truncate shell-business-name">Greg Tracker</p>
        <p class="text-sm font-bold text-slate-100 tracking-tight">Secure Access</p>
      </div>
      <a href="/help.html?page=login" class="inline-flex items-center justify-center p-2 text-slate-400 hover:text-rose-300 hover:bg-slate-800 rounded-lg shrink-0" title="Help - User Manual" aria-label="Help"><span class="material-icons-round">help_outline</span></a>
    </div>
  </header>

  <div class="flex-1 flex items-center justify-center p-4 relative overflow-hidden min-h-0">
  <!-- Background decoration -->
  <div class="absolute top-1/4 -left-1/4 w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-1/4 -right-1/4 w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="glass-card w-full max-w-sm p-8 rounded-3xl shadow-2xl relative z-10 border border-white/20">
    <div class="text-center mb-8">
      <div id="login-logo-container" class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center font-black text-2xl shadow-lg mx-auto mb-4 overflow-hidden">RB</div>
      <p id="login-headline" class="text-sm font-semibold text-slate-500 uppercase tracking-widest">Enter your access code</p>
      <p id="login-subline" class="text-xs text-slate-400 mt-1">Use your company secure code to continue</p>
    </div>

    <form id="login-form" class="space-y-6" onsubmit="event.preventDefault(); submitLogin();">
      <div id="login-team-fields" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Team member</label>
          <select id="login-user-id" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 text-sm font-medium">
            <option value="">Select your name</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2"><span id="pin-label">Access Code</span></label>
        <div class="relative">
          <span class="material-icons-round absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
          <input type="password" id="pin" inputmode="numeric" required placeholder="Enter your access code" class="w-full bg-white border border-slate-200 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 font-black tracking-widest text-lg transition-all" />
        </div>
        <p id="error-msg" class="text-rose-500 text-xs font-bold mt-2 hidden text-center">Invalid access code. Please try again.</p>
      </div>
      
      <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-md">
        <span>Enter Workspace</span>
        <span class="material-icons-round text-[18px]">arrow_forward</span>
      </button>
      <p class="text-center mt-5"><a href="/" class="text-xs font-semibold text-slate-500 hover:text-slate-300 transition-colors">Racketty Boom home</a></p>
    </form>
  </div>
  </div>

  <div data-shell-footer data-shell-footer-dark class="shrink-0 bg-slate-900/95"></div>

  <script>
    function escLogoSrc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
        .replace(/</g, '&lt;');
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings/public');
        const data = res.ok ? await res.json() : {};
        if (data.business_name) {
          document.title = 'Secure Access - ' + data.business_name;
        }
        const defaultLogo = window.GREG_TRACKER_DEFAULT_LOGO_URL || '/assets/landing/logo.svg';
        const logoUrl = data.logo_url || defaultLogo;
        const container = document.getElementById('login-logo-container');
        container.innerHTML = '<img src="' + escLogoSrc(logoUrl) + '" class="w-full h-full object-contain" alt="" />';
        container.classList.remove('bg-gradient-to-br', 'from-blue-500', 'to-indigo-600', 'text-white', 'font-black', 'text-2xl');
      } catch (e) {
        var c = document.getElementById('login-logo-container');
        var u = window.GREG_TRACKER_DEFAULT_LOGO_URL || '/assets/landing/logo.svg';
        if (c) {
          c.innerHTML = '<img src="' + escLogoSrc(u) + '" class="w-full h-full object-contain" alt="" />';
          c.classList.remove('bg-gradient-to-br', 'from-blue-500', 'to-indigo-600', 'text-white', 'font-black', 'text-2xl');
        }
      }
    }
    loadSettings();

    var loginMultiUser = false;

    async function loadAuthOptions() {
      try {
        const res = await fetch('/api/auth/options');
        if (!res.ok) return;
        const data = await res.json();
        loginMultiUser = !!data.multiUser;
        var teamEl = document.getElementById('login-team-fields');
        var sel = document.getElementById('login-user-id');
        if (loginMultiUser && data.users && data.users.length) {
          teamEl.classList.remove('hidden');
          document.getElementById('login-headline').textContent = 'Sign in as team member';
          document.getElementById('login-subline').textContent = 'Choose your name and enter your personal access code.';
          document.getElementById('pin-label').textContent = 'Your access code';
          sel.innerHTML = '<option value="">Select your name</option>' +
            data.users.map(function (u) {
              return '<option value="' + u.id + '">' + (u.display_name || 'User') + ' (' + u.role + ')</option>';
            }).join('');
        } else {
          teamEl.classList.add('hidden');
        }
      } catch (e) {}
    }
    loadAuthOptions();

    async function submitLogin() {
      var pin = document.getElementById('pin').value;
      var btn = document.getElementById('btn-login');
      var err = document.getElementById('error-msg');
      var body = { pin: pin };

      if (loginMultiUser) {
        var uid = document.getElementById('login-user-id').value;
        if (!uid) {
          err.textContent = 'Select your name.';
          err.classList.remove('hidden');
          return;
        }
        body.user_id = Number(uid);
      }

      err.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-icons-round animate-spin">refresh</span>';

      try {
        var res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          window.location.href = '/dashboard.html';
        } else {
          var msg = 'Invalid access code. Please try again.';
          try {
            var j = await res.json();
            if (j && j.error) msg = j.error;
          } catch (e2) {}
          err.textContent = msg;
          err.classList.remove('hidden');
          document.getElementById('pin').value = '';
          document.getElementById('pin').focus();
        }
      } catch (error) {
        err.textContent = 'Connection error. Check server.';
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Enter Workspace</span><span class="material-icons-round text-[18px]">arrow_forward</span>';
      }
    }
  </script>
  <script src="/js/app-shell.js"></script>
</body>
</html>
