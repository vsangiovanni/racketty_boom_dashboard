<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Racketty Boom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(248,250,252,1) 100%); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#f1f5f9] text-slate-800 h-screen flex overflow-hidden">

  <!-- Sidebar included via script or manually (for simplicity repeating here or just simple navigation back) -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0 relative">
    
    <header class="h-16 bg-white/80 backdrop-blur-md shadow-sm flex items-center justify-between px-4 lg:px-8 z-10 flex-shrink-0 border-b border-slate-200/50">
      <div class="flex items-center gap-3">
        <a href="/" class="text-slate-500 hover:bg-slate-100 p-2 rounded-lg transition-colors"><span class="material-icons-round">arrow_back</span></a>
        <h1 class="text-xl font-bold text-slate-800 tracking-tight">System Settings</h1>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 lg:p-8 scrollbar-hide">
      
      <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden">
          <div class="p-6 border-b border-slate-100 bg-slate-50/30">
            <h2 class="text-lg font-bold text-slate-800 tracking-wide">Company & Security</h2>
            <p class="text-xs text-slate-500 mt-1">Update your business details, PIN, and branding.</p>
          </div>
          
          <form id="settings-form" class="p-6 space-y-6" onsubmit="event.preventDefault(); saveSettings();">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Company Name</label>
                <input type="text" id="business_name" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 font-medium transition-all" />
              </div>
              
              <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">App PIN (4 Digits)</label>
                <input type="text" id="app_pin" inputmode="numeric" pattern="[0-9]{4}" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 font-medium tracking-widest transition-all" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-4 border-t border-slate-100">
              <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">Company Logo</label>
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center overflow-hidden" id="logo-preview-container">
                    <span class="material-icons-round text-slate-300">business</span>
                  </div>
                  <div class="flex-1">
                    <input type="file" id="logo" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" onchange="previewImage(this, 'logo-preview-container')" />
                  </div>
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-2">User Avatar</label>
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center overflow-hidden" id="avatar-preview-container">
                    <span class="material-icons-round text-slate-300">person</span>
                  </div>
                  <div class="flex-1">
                    <input type="file" id="avatar" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" onchange="previewImage(this, 'avatar-preview-container')" />
                  </div>
                </div>
              </div>
            </div>

            <div class="pt-6 border-t border-slate-100 flex items-center justify-end gap-3">
              <p id="status-msg" class="text-xs font-bold mr-auto hidden"></p>
              <button type="button" onclick="window.location.href='/'" class="px-5 py-2.5 rounded-lg font-bold text-sm text-slate-600 hover:bg-slate-100 transition-colors">Cancel</button>
              <button type="submit" id="btn-save" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg font-bold text-sm shadow-sm hover:bg-blue-700 transition-colors flex items-center gap-2">
                <span class="material-icons-round text-[18px]">save</span> Save Settings
              </button>
            </div>

          </form>
        </div>
      </div>

    </main>
  </div>

  <script>
    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        
        document.getElementById('business_name').value = data.business_name || '';
        document.getElementById('app_pin').value = data.app_pin || '';

        if (data.logo_url) {
          document.getElementById('logo-preview-container').innerHTML = `<img src="${data.logo_url}" class="w-full h-full object-contain" />`;
        }
        if (data.avatar_url) {
          document.getElementById('avatar-preview-container').innerHTML = `<img src="${data.avatar_url}" class="w-full h-full object-cover" />`;
        }
      } catch (e) {
        console.error('Failed to load settings', e);
      }
    }

    function previewImage(input, containerId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const className = containerId === 'avatar-preview-container' ? 'object-cover' : 'object-contain';
          document.getElementById(containerId).innerHTML = `<img src="${e.target.result}" class="w-full h-full ${className}" />`;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function saveSettings() {
      const btn = document.getElementById('btn-save');
      const msg = document.getElementById('status-msg');
      const form = document.getElementById('settings-form');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="material-icons-round animate-spin">refresh</span> Saving...';
      msg.classList.add('hidden');

      try {
        const formData = new FormData();
        formData.append('business_name', document.getElementById('business_name').value);
        formData.append('app_pin', document.getElementById('app_pin').value);
        
        const logoFile = document.getElementById('logo').files[0];
        if (logoFile) formData.append('logo', logoFile);
        
        const avatarFile = document.getElementById('avatar').files[0];
        if (avatarFile) formData.append('avatar', avatarFile);

        const res = await fetch('/api/settings', {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          msg.textContent = 'Settings saved successfully!';
          msg.className = 'text-xs font-bold mr-auto text-emerald-600';
          msg.classList.remove('hidden');
          // Update cookie if PIN changed
          await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin: document.getElementById('app_pin').value })
          });
          setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
          throw new Error('Failed to save');
        }
      } catch (e) {
        msg.textContent = 'Error saving settings.';
        msg.className = 'text-xs font-bold mr-auto text-rose-500';
        msg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-icons-round text-[18px]">save</span> Save Settings';
      }
    }

    loadSettings();
  </script>
</body>
</html>
