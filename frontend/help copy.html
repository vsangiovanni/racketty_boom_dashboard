<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Manual - Greg Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <a href="/" class="inline-flex items-center gap-1.5 text-slate-600 hover:text-blue-700 text-sm font-semibold shrink-0">
        <span class="material-icons-round text-lg">arrow_back</span>
        <span>Back</span>
      </a>
      <div class="min-w-0 flex-1 text-right">
        <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide truncate shell-business-name">Greg Tracker</p>
        <h1 class="text-lg font-bold text-slate-900">User Manual</h1>
      </div>
    </div>
  </header>

  <main class="flex-1 px-4 py-6 max-w-4xl mx-auto w-full flex flex-col" data-shell-footer>
    <section class="bg-white rounded-2xl border border-slate-200 p-6 md:p-8 shadow-sm">
      <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2 mb-3">
        <span class="material-icons-round text-blue-600">menu_book</span>
        This page has moved
      </h2>
      <p class="text-slate-600 mb-4">
        The English user manual is now available in <a class="text-blue-600 hover:text-blue-700 font-semibold" href="/help.html">/help.html</a>.
      </p>
      <div class="flex gap-2 flex-wrap">
        <a class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors" href="/help.html?page=dashboard">
          Open manual
        </a>
        <a class="inline-flex items-center justify-center px-4 py-2 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition-colors" href="/help.html">
          Go to help index
        </a>
      </div>
      <script>
        // Keep the UX snappy: if the browser supports it, redirect after a short delay.
        setTimeout(function () {
          try { window.location.replace('/help.html?page=dashboard'); } catch (e) {}
        }, 600);
      </script>
    </section>
  </main>

  <script src="/js/app-shell.js"></script>
</body>
</html>
